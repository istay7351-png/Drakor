<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAKOR - Nonton Drakor Tanpa Iklan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:white}
header{background:#e50914;padding:13px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:99}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}
.logo span{color:#ffcc00}
.search{flex:1;background:#222;border:none;padding:9px 12px;border-radius:20px;color:white;outline:none}
.top-btn{background:#ffcc00;border:none;padding:8px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
.count{padding:12px 15px;font-size:13px;color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 20px}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover;cursor:pointer}
.card-body{padding:10px}
.card-title{font-weight:bold;font-size:14px}
.card-sub{font-size:11px;color:#aaa;margin:5px 0}
.badge{background:#e50914;font-size:9px;padding:2px 6px;border-radius:10px;color:white}
.delete-btn{background:#ff0000;color:white;border:none;padding:7px 10px;border-radius:15px;font-size:11px;font-weight:bold;cursor:pointer;margin-top:6px}
.edit-btn{background:#ffcc00;color:black;border:none;padding:7px 10px;border-radius:15px;font-size:11px;font-weight:bold;cursor:pointer;margin-top:6px;margin-left:5px}
.player{position:fixed;top:0;left:0;right:0;bottom:0;background:black;z-index:999;display:none;flex-direction:column}
.player video{width:100%;flex:1;background:black}
.player-top{padding:12px;display:flex;justify-content:space-between;background:#000}
.close-btn{background:#ff0000;color:white;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}
.add-box{padding:12px;background:#1a1a1a;margin:0 12px 15px;border-radius:12px}
.add-box input{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none;background:#222;color:white;outline:none}
.add-box button{width:100%;background:#ffcc00;padding:10px;border:none;border-radius:10px;font-weight:bold;margin-top:5px}
</style>
</head>
<body>

<header>
<div class="logo">DRA<span>KOR</span></div>
<input class="search" id="cari" placeholder="Cari drakor..." oninput="cari()">
<button class="top-btn" onclick="document.getElementById('add').scrollIntoView({behavior:'smooth'})">+ Tambah</button>
</header>

<div class="count" id="count"></div>

<div class="add-box" id="add">
<b>➕ TAMBAH DRAKOR BARU</b>
<input id="jBaru" placeholder="Judul Drakor">
<input id="gBaru" placeholder="Genre">
<input id="imgBaru" placeholder="Link Gambar Poster">
<input id="vidBaru" placeholder="Link Video MP4">
<button onclick="tambah()">SIMPAN DRAKOR</button>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
<div class="player-top"><b id="judulPlay">Nonton</b><button class="close-btn" onclick="tutup()">✕ TUTUP</button></div>
<video id="videoPlay" controls autoplay></video>
</div>

<script>
let videos=[
{title:"Queen of Tears",genre:"Romance | 16 Eps",img:"https://picsum.photos/400/600?random=11",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},
{title:"Vincenzo",genre:"Action | Comedy",img:"https://picsum.photos/400/600?random=12",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"},
{title:"Crash Landing On You",genre:"Romance",img:"https://picsum.photos/400/600?random=13",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"},
{title:"Itaewon Class",genre:"Drama | Bisnis",img:"https://picsum.photos/400/600?random=14",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"},
{title:"Goblin",genre:"Fantasy | Romance",img:"https://picsum.photos/400/600?random=15",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"},
{title:"Reply 1988",genre:"Family | Comedy",img:"https://picsum.photos/400/600?random=16",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"}
];
function tampilkan(list){
  document.getElementById('count').innerText = "Menampilkan "+list.length+" Drakor • Tanpa Iklan";
  document.getElementById('grid').innerHTML = list.map(v=>{
    let idx = videos.indexOf(v);
    return '<div class="card"><img src="'+v.img+'" onclick="play('+idx+')"><div class="card-body"><div class="card-title">'+v.title+'</div><div class="card-sub"><span class="badge">TANPA IKLAN</span> '+v.genre+'</div><button class="delete-btn" onclick="hapusVideo('+idx+')">🗑️ HAPUS</button><button class="edit-btn" onclick="editVideo('+idx+')">✏️ EDIT</button></div></div>'
  }).join('');
}
function cari(){let q=document.getElementById('cari').value.toLowerCase();tampilkan(videos.filter(v=>v.title.toLowerCase().includes(q)))}
function play(i){document.getElementById('player').style.display='flex';document.getElementById('judulPlay').innerText=videos[i].title;let vp=document.getElementById('videoPlay');vp.src=videos[i].video;vp.play()}
function tutup(){let vp=document.getElementById('videoPlay');vp.pause();vp.src='';document.getElementById('player').style.display='none'}
function hapusVideo(i){if(confirm("Yakin mau hapus "+videos[i].title+" bro?")){videos.splice(i,1);cari();alert("Udah kehapus bro!")}}
function editVideo(i){let j=prompt("Ganti judul bro:",videos[i].title);if(j)videos[i].title=j;let l=prompt("Ganti link video bro:",videos[i].video);if(l)videos[i].video=l;cari();alert("Udah ke-edit bro!")}
function tambah(){let j=document.getElementById('jBaru').value;let g=document.getElementById('gBaru').value;let im=document.getElementById('imgBaru').value;let vi=document.getElementById('vidBaru').value;if(!j||!vi){alert("Isi judul & link video dulu bro!");return}videos.unshift({title:j,genre:g||"Drakor",img:im||"https://picsum.photos/400/600?random="+Math.floor(Math.random()*100),video:vi});document.getElementById('jBaru').value='';document.getElementById('gBaru').value='';document.getElementById('imgBaru').value='';document.getElementById('vidBaru').value='';cari();alert("Drakor baru udah masuk bro!")}
tampilkan(videos);
</script>
</body>
  </html>
